<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found | Design In Motion</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'oxford': '#002147',
                        'bone': '#F9F6EE',
                    },
                    fontFamily: {
                        'sans': ['Outfit', 'sans-serif'],
                        'display': ['Space Grotesk', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    
    <!-- We link to global CSS for consistency -->
    <link rel="stylesheet" href="css/global.css">
    
    <script>
        // 1. SMART ROUTING LOGIC
        // This script runs immediately in the <head> before the page even renders.
        document.addEventListener("DOMContentLoaded", () => {
            const brokenUrl = window.location.pathname.toLowerCase();
            const repoName = "graphic-portfolio"; // Your GitHub repo name
            
            // Determine the base URL dynamically (handles both local testing and GitHub Pages)
            const baseUrl = window.location.origin + (brokenUrl.includes(repoName) ? "/" + repoName : "");

            // Define the pages that belong in the /pages/ directory
            const subPages = ['artifacts', 'copyright', 'principles', 'elements', 'theory'];

            // Loop through and check if the user tried to access one of these pages from the root
            for (let page of subPages) {
                if (brokenUrl.includes(`/${page}.html`) || brokenUrl.endsWith(`/${page}`)) {
                    // Redirect them instantly to the correct folder
                    window.location.replace(`${baseUrl}/pages/${page}.html`);
                    return; // Stop execution
                }
            }
        });
    </script>
</head>

<body class="antialiased selection:bg-oxford selection:text-bone min-h-screen flex flex-col items-center justify-center bg-bone text-oxford overflow-hidden relative">

    <!-- Background Grid -->
    <div class="absolute inset-0 z-0 pointer-events-none opacity-20">
        <svg width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <pattern id="grid404" width="40" height="40" patternUnits="userSpaceOnUse">
                    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#002147" stroke-width="0.5"/>
                </pattern>
            </defs>
            <rect width="100%" height="100%" fill="url(#grid404)" />
        </svg>
    </div>

    <!-- 404 Content -->
    <main class="relative z-10 text-center px-6 w-full max-w-4xl mx-auto flex flex-col items-center">
        <!-- Responsive Bounding Box Container -->
        <div class="relative w-full aspect-[4/3] md:aspect-[21/9] flex items-center justify-center mb-12 mt-4">
            
            <!-- Fluid SVG Missing Asset Box -->
            <svg width="100%" height="100%" class="absolute inset-0 pointer-events-none overflow-visible" xmlns="http://www.w3.org/2000/svg">
                <!-- Main Bounding Box -->
                <rect x="0" y="0" width="100%" height="100%" fill="none" stroke="#002147" stroke-width="2" />
                
                <!-- The Classic Missing Link "X" -->
                <line x1="0" y1="0" x2="100%" y2="100%" stroke="#002147" stroke-width="1" opacity="0.3" />
                <line x1="100%" y1="0" x2="0" y2="100%" stroke="#002147" stroke-width="1" opacity="0.3" />
                
                <!-- Top Left Node -->
                <rect x="-5" y="-5" width="10" height="10" fill="#F9F6EE" stroke="#002147" stroke-width="2" />
                <!-- Top Right Node -->
                <svg x="100%" y="0" class="overflow-visible"><rect x="-5" y="-5" width="10" height="10" fill="#F9F6EE" stroke="#002147" stroke-width="2" /></svg>
                <!-- Bottom Left Node -->
                <svg x="0" y="100%" class="overflow-visible"><rect x="-5" y="-5" width="10" height="10" fill="#F9F6EE" stroke="#002147" stroke-width="2" /></svg>
                <!-- Bottom Right Node -->
                <svg x="100%" y="100%" class="overflow-visible"><rect x="-5" y="-5" width="10" height="10" fill="#F9F6EE" stroke="#002147" stroke-width="2" /></svg>
                <!-- Top Center Node -->
                <svg x="50%" y="0" class="overflow-visible"><rect x="-5" y="-5" width="10" height="10" fill="#F9F6EE" stroke="#002147" stroke-width="2" /></svg>
                <!-- Bottom Center Node -->
                <svg x="50%" y="100%" class="overflow-visible"><rect x="-5" y="-5" width="10" height="10" fill="#F9F6EE" stroke="#002147" stroke-width="2" /></svg>

                <!-- Center Node & Spinning Handle -->
                <svg x="50%" y="50%" class="overflow-visible">
                    <g class="origin-center animate-[spin_8s_linear_infinite]">
                        <rect x="-5" y="-5" width="10" height="10" fill="#F9F6EE" stroke="#002147" stroke-width="2" />
                        <line x1="0" y1="0" x2="70" y2="-70" stroke="#002147" stroke-width="2" />
                        <circle cx="70" cy="-70" r="6" fill="#F9F6EE" stroke="#002147" stroke-width="2" />
                    </g>
                </svg>
            </svg>

            <!-- Massive 404 Typography -->
            <h1 class="text-[100px] sm:text-[150px] md:text-[200px] font-display font-bold leading-none tracking-tighter text-oxford relative z-10 px-8 bg-bone/80 backdrop-blur-sm">
                404
            </h1>
        </div>
        
        <p class="font-sans text-xs md:text-sm uppercase tracking-[0.3em] font-bold mb-4 text-oxford/60">Asset Not Found</p>
        <h2 class="text-xl md:text-2xl font-display mb-10 max-w-md mx-auto leading-relaxed">The requested composite is missing from the artboard.</h2>
        
        <a href="index.html" class="inline-flex items-center gap-3 border border-oxford text-oxford px-8 py-4 font-bold uppercase tracking-widest text-xs hover:bg-oxford hover:text-bone transition-colors group">
            <span class="w-1.5 h-1.5 bg-oxford group-hover:bg-bone transition-colors rounded-full animate-pulse"></span>
            Return to Canvas
        </a>
    </main>
    
    <!-- Footer watermark -->
